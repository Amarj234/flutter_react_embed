name: flutter_react_embed
description: Embed React web apps and React Native apps in Flutter as native platform views on Android and iOS, with a typed JSON-RPC bridge between Dart and JavaScript.
version: 1.1.0
repository: https://github.com/Amarj234/flutter_react_embed/tree/main/packages/flutter_react_embed
issue_tracker: https://github.com/Amarj234/flutter_react_embed/issues
topics:
  - react
  - webview
  - react-native
  - micro-frontends
  - platform-views
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  collection: ^1.18.0
  flutter:
    sdk: flutter
  flutter_react_embed_android: ^1.1.0
  flutter_react_embed_ios: ^1.1.0
  flutter_react_embed_platform_interface: ^1.1.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        default_package: flutter_react_embed_android
      ios:
        default_package: flutter_react_embed_ios
