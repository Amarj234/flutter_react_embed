org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Read by the React Native Gradle plugin when FRE_REACT_NATIVE=1 (see app/build.gradle.kts).
newArchEnabled=true
hermesEnabled=true
# Flutter already pins Java/Kotlin to 17 per module; the React Native plugin's own
# toolchain alignment fails under AGP 9 with builtInKotlin=false.
react.internal.disableJavaVersionAlignment=true
