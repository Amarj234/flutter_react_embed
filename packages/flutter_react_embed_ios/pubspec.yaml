name: flutter_react_embed_ios
description: iOS implementation of flutter_react_embed (WKWebView engine).
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^5.0.0

flutter:
  plugin:
    implements: flutter_react_embed
    platforms:
      ios:
        pluginClass: FlutterReactEmbedPlugin
